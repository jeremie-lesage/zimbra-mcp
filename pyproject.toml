[project]
name = "zimbra-mcp"
version = "0.1.0"
description = "Serveur MCP pour Zimbra - Gestion des emails, tags et calendrier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "python-zimbra>=2.0.1",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
zimbra-mcp = "zimbra_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zimbra_mcp"]
